[project]
name = "ai-eng2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "JISHNUDHARMANA", email = "jishnutheinnocent@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
